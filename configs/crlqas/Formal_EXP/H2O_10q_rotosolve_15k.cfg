# CRLQAS — H2O 10q (jordan_wigner, near-equilibrium geometry)
# Matched to HyCRLQAS large_mol settings for fair comparison:
#   episodes=15000, num_layers=70, accept_err=2.90, Rotosolve sweeps=2
[general]
episodes = 15000
eval_every = 1000
eval_K = 50
num_parallel_envs = 8
save_every = 1000
compute_pcd = 0

[env]
num_qubits = 10
num_layers = 70
err_mitig = 0
rand_halt = 0

n_shots = 0
noise_models = 0
noise_values = 0

fake_min_energy = -78.286
fn_type = incremental_with_fixed_start
accept_err = 2.90
shift_threshold_time = 500
shift_threshold_ball = 1e-3
success_thresh = 50
succ_radius_shift = 10
succes_switch = 2.90
thresholds = []
switch_episodes = []
curriculum_type = MovingThreshold

[problem]
ham_type = H2O_10q
geometry = H -0.02 0. 0.; O 0.84 0.45 0.; H 1.48 -0.27 0.
mapping = jordan_wigner
mol_file = H2O_10q_geom_H_-0.02_0._0.;_O_0.84_0.45_0.;_H_1.48_-0.27_0._jordan_wigner.npz

[agent]
batch_size = 1000
memory_size = 20000
neurons = [5000,5000,5000,5000,5000]
dropout = 0.
learning_rate = 0.0001
angles = 0
en_state = 1
agent_type = DeepQNstep
agent_class = DQN_Nstep
n_step = 6
init_net = 0
update_target_net = 500
final_gamma = 0.005
epsilon_decay = 0.99995
epsilon_min = 0.05
epsilon_restart = 1.0

[non_local_opt]
method = scipy_each_step
optim_alg = Rotosolve
rotosolve_sweeps = 2
global_batched_rotosolve = 1
local_size = 8
