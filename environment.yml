# Direct dependencies observed in the benchmark environment, without local prefixes.
# Qulacs GPU builds are optional and installed separately.
name: psqasbench
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - libstdcxx-ng
  - pip:
      - numpy==2.2.6
      - scipy==1.15.2
      - torch==2.10.0
      - qulacs==0.6.13
      - pennylane==0.42.3
      - pennylane-lightning==0.42.0
      - autoray==0.7.2
      - pyscf==2.13.1
      - basis-set-exchange==0.12
      - matplotlib==3.10.8
      - wandb==0.25.1
      - tqdm==4.67.3
